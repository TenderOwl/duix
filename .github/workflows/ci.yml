name: CI

# The Dart job runs on every push and pull request and needs no native
# dependencies. The native job compiles SDL3 and Skia from source, which is far
# too heavy for a hosted runner to do on every push, so it runs on demand and on
# a weekly schedule and reports its result without blocking a pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  # The event name is part of the group, so a push does not cancel a manual
  # run: the native job builds Skia from source and must not be interrupted
  # halfway.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # A push cancels the previous run to keep the feedback fast. A manual or
  # scheduled run builds Skia from source and must not be cancelled halfway.
  cancel-in-progress: >-
    ${{ github.event_name == 'push'
        || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dart:
    name: Dart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib example test

      - name: Analyze
        run: dart analyze

      # The clipboard tests need the real system clipboard and the native tests
      # need a built dui_native library, so both run in the native job.
      - name: Test
        run: dart test --exclude-tags clipboard,native

  native:
    name: Native (${{ matrix.os }})
    # The native job is best effort: the Skia build needs far more disk and
    # time than a hosted runner provides, and the macOS runners have no window
    # server, so the window based checks only run on Windows and Linux. The
    # macOS runner still builds the library and publishes it as an artifact.
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # The native job drives the packaging scripts, which are Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # clang-cl needs the Windows SDK and the MSVC environment to find the
      # headers and the import libraries.
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake ninja-build git pkg-config python3 \
            libasound2-dev libdbus-1-dev libdrm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgbm-dev libibus-1.0-dev libpulse-dev \
            libudev-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev \
            libxi-dev libxkbcommon-dev libxrandr-dev libxcursor-dev \
            libxss-dev libxtst-dev libfontconfig1-dev libfreetype6-dev \
            libgtk-4-dev xvfb

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: .native-deps
          key: native-deps-${{ matrix.os }}-${{ hashFiles('tools/bootstrap_native.py') }}

      - name: Build the native library
        run: python tools/bootstrap_native.py

      # The native tests open real windows, so Linux needs a virtual display.
      # The clipboard tests stay excluded: a runner has no user session that
      # owns the system clipboard. The macOS runners have no window server, so
      # there the window based checks are skipped.
      - name: Test
        if: runner.os == 'Linux'
        run: xvfb-run -a dart test --tags native --exclude-tags clipboard

      - name: Test
        if: runner.os == 'Windows'
        run: dart test --tags native --exclude-tags clipboard

      - name: Smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a dart run example/native_smoke.dart --smoke --diagnostics

      - name: Smoke
        if: runner.os == 'Windows'
        run: dart run example/native_smoke.dart --smoke --diagnostics

      # The packaging step installs the library with the CMake install rules,
      # reports the runtime dependencies and checks that a program loads the
      # library from the release bundle. The steps run even when a test
      # failed, so a broken test does not throw the built library away.
      - name: Package
        if: always()
        run: python tools/package.py

      # The distribution folder is what gets published, so it is assembled on
      # every native build as well.
      - name: Distribution
        if: always()
        run: python tools/package.py --dist --no-verify

      # The built library of every platform is published as an artifact, so the
      # release bundle can be assembled from the runners.
      - name: Upload the native artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: build/dist/
          retention-days: 30
          if-no-files-found: error
