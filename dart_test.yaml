# The native layer allows only one native host per process, because SDL has a
# single global event queue. The native tests create such a host, and
# `dart test` runs the test files in parallel isolates, so two native files
# would compete for the host. The test files are small, so the suite runs them
# one after another instead.
concurrency: 1

tags:
  clipboard:
    description: >
      Tests that drive the real system clipboard of the host machine. They fail
      when another process holds the Windows clipboard, so they are excluded
      with `dart test --exclude-tags clipboard`.
  native:
    description: >
      Tests that load the native dui_native library. They need a built native
      library and are excluded from the pure Dart CI job with
      `dart test --exclude-tags native`.
