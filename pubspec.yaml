name: duix
description: >-
  A retained-mode UI toolkit for Dart: a declarative tree of controls with
  real-time rendering through SDL3 and Skia.
version: 0.1.0
publish_to: none
homepage: https://github.com/TenderOwl/duix
repository: https://github.com/TenderOwl/duix
topics:
  - ui
  - widgets
  - graphics
  - rendering
  - layout

environment:
  sdk: ^3.5.0

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
